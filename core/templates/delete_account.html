{% extends 'base.html' %}

{% block title %}Delete Account{% endblock %}

{% block nav_auth %}{% endblock %}

{% block content %}
    <!-- delete account -->
    <h1>Delete Account</h1>
    <p class="text-center">Are you sure? This will permanently delete your account.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Yes, delete my account</button>
    </form>
{% endblock %}
