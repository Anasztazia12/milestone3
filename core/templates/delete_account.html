{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Delete Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon/favicon.ico' %}">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">&#9749;</span>
            <span class="brand-text">WorkCafe</span>
        </a>

        <button type="button" class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open'); this.innerHTML = document.querySelector('.nav-menu').classList.contains('open') ? '&times;' : '&#9776;';">&#9776;</button>

        <div class="nav-menu">
            <div class="nav-links">
                <a href="/" class="fw-semibold mx-2">Home</a>
                <a href="/map/" class="fw-semibold mx-2">Map</a>
            </div>
        </div>
    </nav>

    <!-- delete account -->
    <h1>Delete Account</h1>
    <p class="text-center">Are you sure? This will permanently delete your account.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Yes, delete my account</button>
    </form>

    <!-- footer -->
    <footer>
        <span class="footer-brand">
            <span>&#9749;</span>
            <span class="footer-text">WorkCafe</span>
        </span>
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
