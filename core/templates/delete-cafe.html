{% extends 'base.html' %}

{% block title %}Delete Place - WorkCafe{% endblock %}

{% block content %}
    <!-- delete cafe -->
    <h1>Delete Place</h1>
    <p class="text-center">Are you sure you want to delete "{{ cafe.name }}"? This cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Yes, delete this place</button>
    </form>

    <p><a href="{% url 'my_cafes' %}">Back to My Cafes</a></p>
{% endblock %}
