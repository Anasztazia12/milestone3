{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Booking Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon/favicon.ico' %}">
</head>
<body>
    <!-- homepage content -->
    <div class="box">
        <div class="hero-text">
            <a href="/"><img src="{% static 'images/logo.png' %}" alt="Booking Manager logo" class="corner-image"></a>
            <h1>Booking Manager</h1>
            <p>Manage your <strong>clients</strong>, <strong>bookings</strong> and <strong>invoices</strong> in one place.</p>

            {% if weather_description %}
                <p>Current weather in London: {{ temperature }}&deg;C, {{ weather_description }}</p>
            {% endif %}

            <a href="login.html" class="btn btn-success">Log in</a>
            <a href="signup.html" class="btn btn-outline-success">Sign up</a>
        </div>

        <img src="{% static 'images/business-illustration.gif' %}" alt="Manage your business" class="hero-image">
    </div>

    <!-- footer -->
    <footer>
        <img src="{% static 'images/logo.png' %}" alt="Booking Manager logo" class="footer-image">
        <p>Copyright &copy; 2026 Booking Manager</p>
    </footer>
</body>
</html>
