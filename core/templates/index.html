{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WorkCafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon/favicon.ico' %}">
</head>
<body>
    <!-- homepage content -->
    <div class="box">
        <div class="hero-text">
            <a href="/"><img src="{% static 'images/logo.png' %}" alt="WorkCafe logo" class="corner-image"></a>
            <h1>WorkCafe</h1>
            <p>Find a <strong>cafe</strong> or <strong>workspace</strong> nearby where you can sit down and work.</p>

            {% if weather_description %}
                <p>Current weather in London: {{ temperature }}&deg;C, {{ weather_description }}</p>
            {% endif %}

            <a href="login.html" class="btn btn-success">Log in</a>
            <a href="signup.html" class="btn btn-outline-success">Sign up</a>
        </div>

        <img src="{% static 'images/coffee.gif' %}" alt="Find a place to work" class="hero-image">
    </div>

    <!-- footer -->
    <footer>
        <img src="{% static 'images/logo.png' %}" alt="WorkCafe logo" class="footer-image">
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>
</body>
</html>
