<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add a Place - WorkCafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-text">&#9749; WorkCafe</span>
        </a>

        <button type="button" class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')">&#9776;</button>

        <div class="nav-menu">
            <div class="nav-links">
                <a href="index.html" class="fw-semibold mx-2">Home</a>
                <a href="map.html" class="fw-semibold mx-2">Map</a>
            </div>
            <div class="nav-auth">
                <a href="login.html" class="btn btn-outline-light">Log in</a>
                <a href="signup.html" class="btn btn-light">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- add cafe form -->
    <h1>Register a New Place</h1>
    <form method="post">
        <label for="name">Cafe name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Prufrock Coffee" required>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="Street address" required>

        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="e.g. London" required>

        <label for="wifi">Has wifi?</label>
        <select id="wifi" name="wifi">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <label for="quiet">Has a quiet corner?</label>
        <select id="quiet" name="quiet">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <button type="submit" class="btn btn-success w-100">Add Place</button>
    </form>

    <!-- footer -->
    <footer>
        <span class="footer-brand">&#9749; WorkCafe</span>
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>
</body>
</html>
