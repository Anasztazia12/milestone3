<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-text">&#9749; WorkCafe</span>
        </a>

        <button type="button" class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')">&#9776;</button>

        <div class="nav-menu">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="map.html">Map</a>
            </div>
            <div class="nav-auth">
                <a href="login.html" class="btn btn-light">Log in</a>
            </div>
        </div>
    </nav>

    <!-- signup form -->
    <h1>Create your account</h1>
    <form method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

        <label for="password1">Password</label>
        <input type="password" id="password1" name="password1" placeholder="Enter a password" autocomplete="new-password" required>

        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" placeholder="Re-enter your password" autocomplete="new-password" required>

        <button type="submit" class="btn btn-success w-100">Sign up</button>
    </form>

    <p>Already have an account? <a href="login.html">Log in</a></p>

    <!-- footer -->
    <footer>
        <span class="footer-brand">&#9749; WorkCafe</span>
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>
</body>
</html>
