<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <a href="index.html" class="brand">
        <img src="assets/images/logo.png" alt="Booking Manager logo" class="brand-image">
    </a>

    <h1>Create your account</h1>
    <form method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="password1">Password</label>
        <input type="password" id="password1" name="password1" placeholder="Enter a password" required>

        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" placeholder="Re-enter your password" required>

        <button type="submit" class="btn btn-success w-100">Sign up</button>
    </form>

    <p>Already have an account? <a href="login.html">Log in</a></p>

    <footer>
        <img src="assets/images/logo.png" alt="Booking Manager logo" class="footer-image">
        <p>Copyright &copy; 2026 Booking Manager</p>
    </footer>
</body>
</html>
