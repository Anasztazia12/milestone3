<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Map - WorkCafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-icon">&#9749;</span>
            <span class="brand-text">WorkCafe</span>
        </a>

        <button type="button" class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')">&#9776;</button>

        <div class="nav-menu">
            <div class="nav-links">
                <a href="index.html" class="fw-semibold mx-2">Home</a>
                <a href="map.html" class="fw-semibold mx-2">Map</a>
            </div>
            <div class="nav-auth">
                <a href="login.html" class="btn btn-outline-light">Log in</a>
                <a href="signup.html" class="btn btn-light">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- map page content -->
    <h1>Cafe Map</h1>

    <form class="search-form d-flex" role="search">
        <input type="text" class="form-control" placeholder="Search by name or city">
        <button type="submit" class="btn btn-success">Search</button>
    </form>

    <div class="add-place-card">
        <p>Know a good spot that's not on the map?</p>
        <a href="add-cafe.html" class="btn btn-success">+ Register a new place</a>
    </div>

    <div id="cafe-map"></div>

    <!-- footer -->
    <footer>
        <span class="footer-brand">
            <span>&#9749;</span>
            <span class="footer-text">WorkCafe</span>
        </span>
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        var cafes = [
            { name: "Prufrock Coffee", lat: 51.5204, lng: -0.1086 },
            { name: "Grind Shoreditch", lat: 51.5256, lng: -0.0877 },
            { name: "The Watch House", lat: 51.5002, lng: -0.0815 },
            { name: "Foundation Coffee House", lat: 53.4832, lng: -2.2331 },
            { name: "Takk Coffee Co.", lat: 53.4818, lng: -2.2312 },
            { name: "Ezra & Gil", lat: 53.4827, lng: -2.2325 }
        ];

        var map = L.map('cafe-map').setView([52.5, -1.5], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'WorkCafe &middot; Find a cafe or workspace nearby &middot; Map &copy; OpenStreetMap contributors'
        }).addTo(map);

        for (var i = 0; i < cafes.length; i++) {
            L.marker([cafes[i].lat, cafes[i].lng]).addTo(map).bindPopup(cafes[i].name);
        }
    </script>
</body>
</html>
