<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WorkCafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-text">&#9749; WorkCafe</span>
        </a>
    </nav>

    <!-- homepage content -->
    <div class="box">
        <div class="hero-text">
            <h1>Find a cafe.<br><span>Get to work.</span></h1>

            <p>Search for a nearby cafe or workspace with good wifi and a quiet corner.</p>

            <form class="search-form d-flex" role="search">
                <input type="text" class="form-control" placeholder="Search for a cafe or workspace">
                <button type="submit" class="btn btn-success">Search</button>
            </form>

            <p class="signup-hint">Sign up to see all cafes and save your favourites.</p>

            <a href="login.html" class="btn btn-success">Log in</a>
            <a href="signup.html" class="btn btn-outline-success">Sign up</a>
        </div>

        <div class="hero-image-wrap">
            <img src="assets/images/coffee.gif" alt="Find a place to work" class="hero-image">
        </div>
    </div>

    <!-- footer -->
    <footer>
        <span class="footer-brand">&#9749; WorkCafe</span>
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>
</body>
</html>
