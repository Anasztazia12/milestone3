<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <img src="assets/images/logo.png" alt="WorkCafe logo" class="brand-image">
        </a>
        <a href="index.html" class="btn btn-outline-success">Home</a>
    </nav>

    <!-- login form -->
    <h1>Login</h1>
    <form method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-success w-100">Log in</button>
    </form>

    <p>Don't have an account yet? <a href="signup.html">Sign up</a></p>

    <!-- footer -->
    <footer>
        <img src="assets/images/logo.png" alt="WorkCafe logo" class="footer-image">
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>
</body>
</html>
