<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon/favicon.ico">
</head>
<body>
    <!-- nav bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-text">&#9749; WorkCafe</span>
        </a>

        <button type="button" class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')">&#9776;</button>

        <div class="nav-menu">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="map.html">Map</a>
            </div>
            <div class="nav-auth">
                <a href="signup.html" class="btn btn-light">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- login form -->
    <h1>Login</h1>
    <form method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-success w-100">Log in</button>
    </form>

    <p>Don't have an account yet? <a href="signup.html">Sign up</a></p>

    <!-- footer -->
    <footer>
        <span class="footer-brand">&#9749; WorkCafe</span>
        <p>Copyright &copy; 2026 WorkCafe</p>
    </footer>
</body>
</html>
